# Tests and spec validation on every push and pull request, on all three platforms.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (any file access without an explicit encoding fails, as it would on Windows)
        run: python -X warn_default_encoding -m pytest -q -W error::EncodingWarning
      - name: The example project is a valid workspace
        run: bimai validate packs/project-site/examples/knooppunt-oost

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  civil3d-bridge:
    # The Civil 3D add-in: protocol tests on Windows and Linux; on Windows also the add-in for
    # Civil 3D 2025-2026 (.NET 8) and 2027 (.NET 10), compiled against Autodesk's NuGet packages,
    # and the bundle zip users install.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Protocol tests (.NET 8 and .NET 10)
        run: dotnet test bridges/civil3d/tests/Bimai.Mcp.Tests -c Release -nologo
      - name: Build the add-in and the bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bridges/civil3d/build.ps1
      - name: Build the add-in and the bundle
        if: runner.os != 'Windows'
        run: ./bridges/civil3d/build.sh
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Install and remove the bridge end to end, as a user would (Windows)
        # GitHub's Windows runners are administrators with UAC off, so the elevated install runs for real.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install -e . --quiet
          $bundle = Join-Path $env:ProgramFiles 'Autodesk\ApplicationPlugins\bimai-civil3d.bundle'
          bimai bridge install civil3d --from bridges/civil3d/dist/bimai-civil3d-bridge.zip --yes
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          foreach ($tfm in 'net8.0-windows', 'net10.0-windows') {
            if (-not (Test-Path "$bundle\Contents\$tfm\Bimai.Civil3D.dll")) { throw "missing $tfm build" }
          }
          bimai bridge status civil3d
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          bimai bridge uninstall civil3d --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          if (Test-Path $bundle) { throw "bundle still present after uninstall" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: bimai-civil3d-bridge
          path: bridges/civil3d/dist/bimai-civil3d-bridge.zip

  pyrevit:
    # Sets up the real pyRevit 7.0 the way a Revit user would: Microsoft's .NET runtimes when missing (one
    # elevated step; the runner is an administrator with UAC off), pyRevit's per-user installer, the agent
    # switch, and the read-only connection.
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyRevit and connect it, as a user would
        shell: pwsh
        run: |
          pip install -e . --quiet
          Get-ChildItem "$env:ProgramFiles\dotnet\shared\Microsoft.WindowsDesktop.App" -ErrorAction SilentlyContinue | ForEach-Object Name
          $wv = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2: " + ((Get-ItemProperty $wv -ErrorAction SilentlyContinue).pv ?? "not installed")
          $project = Join-Path $env:RUNNER_TEMP "revit-project"
          bimai init $project --person Anna --role "BIM modeller" --tools revit --yes
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          bimai connect pyrevit --path $project --install --yes
          if ($LASTEXITCODE -ne 0) { throw "connect failed" }
          $exe = "$env:APPDATA\pyRevit-Master\bin\pyrevit.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pyrevit doesn't start" }
          & $exe agent status
          $mcp = Get-Content (Join-Path $project ".mcp.json") -Raw | ConvertFrom-Json
          if ($mcp.mcpServers.pyrevit.command -ne $exe) { throw "pyrevit not in .mcp.json" }
          $settings = Get-Content (Join-Path $project ".claude\settings.json") -Raw | ConvertFrom-Json
          if ($settings.permissions.deny -notcontains "mcp__pyrevit__run_modify") { throw "not read-only" }
          bimai connect pyrevit --path $project --yes
          if ($LASTEXITCODE -ne 0) { throw "a second connect should find everything ready" }
      - name: pyRevit installer log
        if: always()
        shell: pwsh
        run: Get-Content "$env:TEMP\bimai-pyrevit-install.log" -Tail 80 -ErrorAction SilentlyContinue

  install:
    # The one-line installers (docs/public/install.sh and install.ps1) on clean runners, installing the
    # freshly built package; then bimai must work from a new shell, as it would for a user.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        shell: bash
        run: |
          pip install build --quiet
          python -m build --wheel --outdir pkg
          echo "WHEEL=$(ls pkg/*.whl)" >> "$GITHUB_ENV"
      - name: Install with install.sh (macOS, Linux)
        if: runner.os != 'Windows'
        run: BIMAI_PACKAGE="$PWD/$WHEEL" sh docs/public/install.sh
      - name: Install with install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BIMAI_PACKAGE = (Resolve-Path $env:WHEEL).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File docs/public/install.ps1
      - name: bimai works from a new shell
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"   # Git Bash maps $HOME to %USERPROFILE% on Windows
          bimai --version
          mkdir -p "$RUNNER_TEMP/project"
          bimai init "$RUNNER_TEMP/project" --person "CI" --role "bim modeller" --yes
          bimai validate "$RUNNER_TEMP/project"
