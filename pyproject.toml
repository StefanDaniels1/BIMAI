[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bimai"
dynamic = ["version"]
description = "An open-source BIM team that lives in your editor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest", "python-docx"]

[project.scripts]
bimai = "bimai.cli:main"

[project.urls]
Documentation = "https://docs.bimai.nl"

[tool.setuptools]
package-dir = { "" = "cli" }

[tool.setuptools.packages.find]
where = ["cli"]

[tool.setuptools.package-data]
bimai = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = { attr = "bimai.__version__" }

[tool.pytest.ini_options]
testpaths = ["packs", "cli/tests"]
