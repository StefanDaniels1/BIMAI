# Copy to .github/workflows/ in a PROJECT repository (not the public bimai repo).
# Rebuilds the private project site whenever the team's work is saved, and publishes it to
# Azure Static Web Apps behind Microsoft sign-in (see staticwebapp.config.json).
name: project-site

on:
  push:
    branches: [main]
    paths: [".bimai/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pipx install bimai
      - run: bimai site build            # generate + static build into .bimai/site/out
      - run: cp .github/staticwebapp.config.json .bimai/site/out/
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .bimai/site/out
          skip_app_build: true
