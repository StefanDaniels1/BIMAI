  <!-- blinking cursor -->
  <rect x="716" y="88" width="43" height="103" fill="#FFB000" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt line -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="24" filter="url(#glow)">
    <text x="262" y="251" fill="#FFB000">$ bimai init<tspan fill="#7A5400">  # a BIM team at your command</tspan></text>
  </g>

  <!-- scanlines -->
  <rect width="960" height="320" rx="28" fill="url(#scan)" pointer-events="none"/>
