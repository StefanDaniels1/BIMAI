<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="bimai — a BIM team at your command">
  <title>bimai</title>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="crt" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1D1710"/>
      <stop offset="100%" stop-color="#14100B"/>
    </radialGradient>
  </defs>

  <!-- CRT screen -->
  <rect width="960" height="320" rx="28" fill="url(#crt)"/>
  <rect x="10" y="10" width="940" height="300" rx="22" fill="none" stroke="#7A5400" stroke-width="2" opacity="0.6"/>

  <!-- window chrome -->
  <g fill="#7A5400">
    <circle cx="44" cy="40" r="6"/><circle cx="64" cy="40" r="6"/><circle cx="84" cy="40" r="6"/>
  </g>
  <text x="920" y="45" text-anchor="end" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="15" fill="#7A5400">bimai — 80×24</text>

  <!-- BIM element -->
  
    <g stroke="#FFB000" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
      <polygon points="150.0,88.0 203.7,119.0 150.0,150.0 96.3,119.0" fill="#FFB000" fill-opacity="0.95"/>
      <polygon points="96.3,119.0 150.0,150.0 150.0,212.0 96.3,181.0" fill="#FFB000" fill-opacity="0.55"/>
      <polygon points="150.0,150.0 203.7,119.0 203.7,181.0 150.0,212.0" fill="#FFB000" fill-opacity="0.25"/>
    </g>
    <g stroke="#FFB000" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.55">
      <line x1="150.0" y1="88.0" x2="150.0" y2="54.0"/>
      <line x1="203.7" y1="181.0" x2="233.7" y2="198.0"/>
      <line x1="96.3" y1="181.0" x2="66.3" y2="198.0"/>
    </g>

